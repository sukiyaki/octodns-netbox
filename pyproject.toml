[build-system]
build-backend = "hatchling.build"
requires = ["hatch-vcs>=0.5.0", "hatchling>=1.27.0"]

[project]
authors = [
  {name = "Tagawa, Masaki", email = "masaki@tagawa.email"}
]
classifiers = [
  'Development Status :: 4 - Beta',
  'Intended Audience :: Developers',
  'License :: OSI Approved :: MIT License',
  'Natural Language :: English',
  'Programming Language :: Python :: 3',
  'Programming Language :: Python :: 3.11',
  'Programming Language :: Python :: 3.12',
  'Programming Language :: Python :: 3.13',
  'Programming Language :: Python :: 3.14',
  'Programming Language :: Python :: 3.15'
]
dependencies = [
  "octodns>=1.10.0,<2.0.0",
  "pydantic>=2.10.5,<3.0.0",
  "pynetbox>=7.4.1,<8.0.0",
  "requests>=2.32.3,<3.0.0"
]
description = "A NetBox source for octoDNS."
dynamic = ["version"]
license = "MIT"
name = "octodns-netbox"
readme = "README.md"
requires-python = ">=3.11,<4"

[project.urls]
Homepage = "https://github.com/sukiyaki/octodns-netbox"

[dependency-groups]
dev = [
  "coverage-conditional-plugin>=0.9.0",
  "pre-commit>=4.0.0",
  "pytest>=9.0.0",
  "pytest-cov>=7.0.0",
  "requests-mock>=1.12.0"
]

[tool.coverage.coverage_conditional_plugin.rules]
# The source uses octoDNS's Rrset when it exists (1.22 and later) and Rr
# otherwise. A line marked with a rule's name is left out of the report when
# the rule is true, so each CI job measures the side it runs: "test" the
# Rrset side, "lowest" the Rr side.
no-cover-with-rrset = "package_version('octodns') >= (1, 22)"
no-cover-without-rrset = "package_version('octodns') < (1, 22)"

[tool.coverage.report]
fail_under = 100

[tool.coverage.run]
plugins = ["coverage_conditional_plugin"]
source = ["octodns_netbox"]

[tool.hatch.build.targets.sdist]
include = ["/octodns_netbox"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
# PyPI rejects local versions, so drop the "+g<sha>" part: 0.5.1.devN.
local_scheme = "no-local-version"

[tool.pytest.ini_options]
addopts = ["--cov", "--cov-report=term-missing"]
# Fail on a deprecated octoDNS call from this package. octoDNS attributes the
# DeprecationWarning of Rr and Record.from_rrs to the module that calls them.
filterwarnings = ["error::DeprecationWarning:octodns_netbox"]
testpaths = ["tests"]

[tool.ruff]
# tests/live/run.py imports cases, record, and seed from its own directory.
src = [".", "tests/live"]
target-version = "py311"

[tool.ruff.lint]
# Ruff 0.15's default rules (E4, E7, E9, F), import sorting, pyupgrade, and the
# rules ruff 0.17's wider default reported on this code. Listing them keeps a
# ruff upgrade from changing what is checked.
select = ["E4", "E7", "E9", "F", "I", "UP", "BLE001", "C405", "RUF012", "SIM117"]

[tool.uv]
# uv build installs the build backend in a separate environment, which
# uv.lock does not cover. These pins fix each package there, and uv.lock
# records them.
build-constraint-dependencies = [
  "hatch-vcs==0.5.0",
  "hatchling==1.33.0",
  "packaging==26.4",
  "pathspec==1.1.1",
  "pluggy==1.7.0",
  "setuptools==84.2.1",
  "setuptools-scm==10.3.4",
  "tomlkit==0.15.3",
  "trove-classifiers==2026.9.21.13",
  "vcs-versioning==2.6.0"
]
