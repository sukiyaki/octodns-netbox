name: release

on:
  push:
    tags:
    - v*

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        # hatch-vcs derives the version from the tag.
        fetch-depth: 0
    - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      with:
        python-version: '3.15'
    # CI runs the same two steps on each pull request.
    - run: uv build
    - run: uv run --locked --only-group release twine check --strict dist/*
    - name: Check that the built version is the version of the tag
      id: version
      run: >-
        uv run --locked --only-group release
        python .github/scripts/check_dist_version.py
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: dist
        path: dist/

  # Only this job can get an OIDC token, and it runs no build code.
  pypi:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/octodns-netbox/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: dist
        path: dist/
    # A rerun of this job uploads the same files again. PyPI reports success
    # for a file that it has with the same contents, and adds the rest.
    # skip-existing would also pass over a file that differs from PyPI's copy.
    - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    needs: [build, pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: dist
        path: dist/
    - name: Create the GitHub release of the tag
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        TAG: ${{ github.ref_name }}
        PRERELEASE: ${{ needs.build.outputs.prerelease }}
      # failglob stops the step if dist/ has no wheel or no sdist. When a rerun
      # finds the release that an earlier attempt created, it replaces the
      # files of that release instead of failing.
      run: |
        set -euo pipefail
        shopt -s failglob
        assets=(dist/*.whl dist/*.tar.gz)
        if gh release view "$TAG" > /dev/null 2>&1; then
          gh release upload "$TAG" "${assets[@]}" --clobber
        else
          gh release create "$TAG" "${assets[@]}" \
            --verify-tag \
            --title "$TAG" \
            --generate-notes \
            --prerelease="$PRERELEASE"
        fi
