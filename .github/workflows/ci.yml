name: ci

on:
  pull_request:
  push:
    branches:
    - main
  workflow_dispatch:

permissions:
  contents: read

# A new commit on a pull request cancels the run of the older commit. A rerun,
# which keeps the commit of its first attempt, and any other event get a group
# of their own run, so they never cancel the newest commit's run, and a push to
# main, the schedule, and a manual run are never cancelled and never wait.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name == 'pull_request'
    && github.run_attempt == '1' && github.event.pull_request.number
    || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == '1' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      with:
        python-version: '3.15'
    - run: uv run --locked pre-commit run --all-files --show-diff-on-failure

  test:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14', '3.15']
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      with:
        python-version: ${{ matrix.python }}
    - run: uv run --locked pytest

  lowest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Resolve direct dependencies at their declared lower bounds.
      UV_RESOLUTION: lowest-direct
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      with:
        python-version: '3.11'
    - run: uv sync
    - run: uv tree --depth 1
    - run: uv run pytest

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        # hatch-vcs derives the version from the latest tag.
        fetch-depth: 0
    - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      with:
        python-version: '3.15'
    # The release workflow runs the same two steps.
    - run: uv build
    - run: uv run --locked --only-group release twine check --strict dist/*
