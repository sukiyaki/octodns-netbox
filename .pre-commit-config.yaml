repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: check-added-large-files
  - id: check-builtin-literals
  - id: check-case-conflict
  - id: check-yaml
    args: [--unsafe]
  - id: check-toml
  - id: debug-statements
  - id: end-of-file-fixer
  - id: forbid-new-submodules
  - id: trailing-whitespace
  - id: mixed-line-ending
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: v0.17.6
  hooks:
    # Run the linter.
  - id: ruff-check
    args: [--fix]
    # Run the formatter.
  - id: ruff-format
- repo: local
  hooks:
  # mypy runs in the project's environment to see pydantic's types. uv.lock
  # pins its version, and pyproject.toml holds its settings.
  - id: mypy
    name: mypy
    entry: uv run --locked mypy
    language: system
    files: ^octodns_netbox/
    pass_filenames: false
