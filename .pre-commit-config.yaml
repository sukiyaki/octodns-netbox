# Every hook runs its tool from the project environment, so uv.lock pins each
# tool and its dependencies, and pyproject.toml holds their settings. Each
# hook's name, entry, file selection, and stages copy the hook of the same id
# in pre-commit-hooks v6.0.0 and ruff-pre-commit v0.17.6.
repos:
- repo: local
  hooks:
  - id: check-added-large-files
    name: check for added large files
    entry: uv run --locked check-added-large-files
    language: system
    stages: [pre-commit, pre-push, manual]
  - id: check-builtin-literals
    name: check builtin type constructor use
    entry: uv run --locked check-builtin-literals
    language: system
    types: [python]
  - id: check-case-conflict
    name: check for case conflicts
    entry: uv run --locked check-case-conflict
    language: system
  - id: check-yaml
    name: check yaml
    entry: uv run --locked check-yaml
    language: system
    types: [yaml]
    args: [--unsafe]
  - id: check-toml
    name: check toml
    entry: uv run --locked check-toml
    language: system
    types: [toml]
  - id: debug-statements
    name: debug statements (python)
    entry: uv run --locked debug-statement-hook
    language: system
    types: [python]
  - id: end-of-file-fixer
    name: fix end of files
    entry: uv run --locked end-of-file-fixer
    language: system
    types: [text]
    stages: [pre-commit, pre-push, manual]
  - id: forbid-new-submodules
    name: forbid new submodules
    entry: uv run --locked forbid-new-submodules
    language: system
    types: [directory]
  - id: trailing-whitespace
    name: trim trailing whitespace
    entry: uv run --locked trailing-whitespace-fixer
    language: system
    types: [text]
    stages: [pre-commit, pre-push, manual]
  - id: mixed-line-ending
    name: mixed line ending
    entry: uv run --locked mixed-line-ending
    language: system
    types: [text]
  - id: ruff-check
    name: ruff check
    entry: uv run --locked ruff check --force-exclude
    language: system
    types_or: [python, pyi, jupyter]
    require_serial: true
    args: [--fix]
  - id: ruff-format
    name: ruff format
    entry: uv run --locked ruff format --force-exclude
    language: system
    types_or: [python, pyi, jupyter, markdown]
    require_serial: true
  - id: mypy
    name: mypy
    entry: uv run --locked mypy
    language: system
    files: ^octodns_netbox/
    pass_filenames: false
